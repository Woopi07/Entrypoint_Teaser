<!doctype html>
<html><head><meta charset="utf-8"><title>woopi Day 1 3D</title>

<style>

  text-shadow:0 0 6px rgba(0,0,0,.9),0 3px 12px rgba(0,0,0,.6);opacity:0}

#end{position:absolute;left:0;right:0;top:330px;text-align:center;opacity:0}
#end .w{font:900 180px "Inter Display";color:#fff6ec;letter-spacing:-4px;-webkit-text-stroke:6px #1f3d2b;text-shadow:0 12px 0 rgba(31,61,43,.35)}

</style></head>

</div>

<script type="module">
import * as THREE from './node_modules/three/build/three.module.js';
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), seg=(t,a,b)=>clamp((t-a)/(b-a));
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, eout=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.7,d=c+1;return 1+d*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const lerp=(a,b,x)=>a+(b-a)*x;
const TL=window.TL, SC={}; TL.scenes.forEach(s=>SC[s.id]=s);
function when(id,word,k=0){ const l=TL.lines.filter(l=>l.scene===id)[k]; if(!word) return l.start;
  const i=l.text.toLowerCase().indexOf(word.toLowerCase()); if(i<0) throw new Error('cue '+word); return l.start+(l.end-l.start)*i/l.text.length; }

// ---------------------------------------------------------------- renderer / world
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1); renderer.setSize(1080,1920,false);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(52,1080/1920,.1,400);
// sky (seen through the window): vertical gradient, warmer at sunrise
const skyCv=document.createElement('canvas'); skyCv.width=4; skyCv.height=256; const skyCx=skyCv.getContext('2d');
const skyTex=new THREE.CanvasTexture(skyCv); skyTex.colorSpace=THREE.SRGBColorSpace;
function paintSky(warm){ const g=skyCx.createLinearGradient(0,0,0,256);
  g.addColorStop(0,`rgb(${lerp(60,110,warm)},${lerp(90,150,warm)},${lerp(160,220,warm)})`);
  g.addColorStop(.6,`rgb(${lerp(120,255,warm)},${lerp(140,200,warm)},${lerp(190,170,warm)})`);
  g.addColorStop(1,`rgb(${lerp(170,255,warm)},${lerp(170,225,warm)},${lerp(200,180,warm)})`);
  skyCx.fillStyle=g; skyCx.fillRect(0,0,4,256); skyTex.needsUpdate=true; }
scene.background=new THREE.Color(0x2a2a30);
const hemi=new THREE.HemisphereLight(0xfff1e0,0x8a6a50,1.1); scene.add(hemi);
const sunLight=new THREE.DirectionalLight(0xffe2b0,0); sunLight.position.set(3.2,6.5,-12); sunLight.target.position.set(.2,0,0); scene.add(sunLight.target);
sunLight.castShadow=true; sunLight.shadow.mapSize.set(2048,2048);
Object.assign(sunLight.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:1,far:40}); sunLight.shadow.bias=-.0005; sunLight.shadow.radius=4; scene.add(sunLight);
const fill=new THREE.DirectionalLight(0xffffff,.9); fill.position.set(4,7,8); fill.castShadow=true; fill.shadow.mapSize.set(1024,1024);
Object.assign(fill.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:1,far:40}); scene.add(fill);
const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.85,metalness:0,...o});
function mesh(geo,mat,x=0,y=0,z=0,parent=scene){ const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; parent.add(m); return m; }
// floor with plank lines
const flCv=document.createElement('canvas'); flCv.width=512; flCv.height=512; const fl=flCv.getContext('2d');
fl.fillStyle='#c99a6b'; fl.fillRect(0,0,512,512); fl.strokeStyle='rgba(90,55,30,.35)'; fl.lineWidth=3;
for(let i=0;i<=8;i++){ fl.beginPath(); fl.moveTo(0,i*64); fl.lineTo(512,i*64); fl.stroke(); for(let k=0;k<3;k++){ const x=((i*97+k*171)%512); fl.beginPath(); fl.moveTo(x,i*64); fl.lineTo(x,i*64+64); fl.stroke(); } }
const flTex=new THREE.CanvasTexture(flCv); flTex.colorSpace=THREE.SRGBColorSpace; flTex.wrapS=flTex.wrapT=THREE.RepeatWrapping; flTex.repeat.set(3,3);
const floor=mesh(new THREE.PlaneGeometry(10,24),new THREE.MeshStandardMaterial({map:flTex,roughness:.7}),0,0,1); floor.rotation.x=-Math.PI/2; floor.castShadow=false;
// walls: back wall has a window opening (x 0.6..3.0, y 1.3..3.3)
const wallB=M(0xf3e6d3), wallS=M(0xd6e7d6);

mesh(new THREE.BoxGeometry(WX0+5,H,.2),wallB,(-5+WX0)/2,H/2,Z);
mesh(new THREE.BoxGeometry(5-WX1,H,.2),wallB,(WX1+5)/2,H/2,Z);
mesh(new THREE.BoxGeometry(WX1-WX0,WY0,.2),wallB,(WX0+WX1)/2,WY0/2,Z);
mesh(new THREE.BoxGeometry(WX1-WX0,H-WY1,.2),wallB,(WX0+WX1)/2,(WY1+H)/2,Z);
mesh(new THREE.BoxGeometry(.2,H,10),wallS,-5,H/2,1); mesh(new THREE.BoxGeometry(.2,H,10),wallS,5,H/2,1);
const ceil=mesh(new THREE.PlaneGeometry(10,24),M(0xfaf3ea,{emissive:0xf4e8d8,emissiveIntensity:.75}),0,H,1); ceil.rotation.x=Math.PI/2; ceil.castShadow=false;
const base=M(0xffffff); mesh(new THREE.BoxGeometry(10,.18,.08),base,0,.09,Z+.13); mesh(new THREE.BoxGeometry(.08,.18,10),base,-4.86,.09,1);
// window frame, sill, panes, outside sky + sun
const wf=M(0xffffff,{roughness:.5});
mesh(new THREE.BoxGeometry(WX1-WX0+.2,.12,.32),wf,(WX0+WX1)/2,WY0,Z+.05); mesh(new THREE.BoxGeometry(WX1-WX0+.2,.12,.28),wf,(WX0+WX1)/2,WY1,Z);
mesh(new THREE.BoxGeometry(.12,WY1-WY0,.28),wf,WX0,(WY0+WY1)/2,Z); mesh(new THREE.BoxGeometry(.12,WY1-WY0,.28),wf,WX1,(WY0+WY1)/2,Z);
mesh(new THREE.BoxGeometry(.07,WY1-WY0,.12),wf,(WX0+WX1)/2,(WY0+WY1)/2,Z); mesh(new THREE.BoxGeometry(WX1-WX0,.07,.12),wf,(WX0+WX1)/2,(WY0+WY1)/2,Z);
const skyPlane=mesh(new THREE.PlaneGeometry(30,16),new THREE.MeshBasicMaterial({map:skyTex}),1.8,3,-16); skyPlane.castShadow=skyPlane.receiveShadow=false;
const hills=mesh(new THREE.SphereGeometry(6,24,12),new THREE.MeshBasicMaterial({color:0x6f9c7b}),-1,-4.2,-14); hills.castShadow=false;
const hills2=mesh(new THREE.SphereGeometry(7,24,12),new THREE.MeshBasicMaterial({color:0x8db596}),7,-5.2,-15); hills2.castShadow=false;
// curtains (slide open in the sun scene)
const curM=M(0xff9f75,{roughness:.95});
const curL=mesh(new THREE.BoxGeometry(1.35,2.4,.08),curM,WX0+.6,(WY0+WY1)/2+.05,Z+.32), curR=mesh(new THREE.BoxGeometry(1.35,2.4,.08),curM,WX1-.6,(WY0+WY1)/2+.05,Z+.32);
mesh(new THREE.CylinderGeometry(.04,.04,3.4,10),M(0x8a6a50),(WX0+WX1)/2,WY1+.22,Z+.32).rotation.z=Math.PI/2;
// sunbeam through the window
const beam=new THREE.Mesh(new THREE.BoxGeometry(2.2,.02,5.5),new THREE.MeshBasicMaterial({color:0xffe6a8,transparent:true,opacity:0,depthWrite:false}));
beam.position.set(1.4,.03,-1.6); scene.add(beam);
// rug, plant, frames, shelf, lamp
const rug=mesh(new THREE.CylinderGeometry(1.5,1.5,.03,48),M(0xffd9b8),.3,.015,-.4); rug.castShadow=false;
const pot=mesh(new THREE.CylinderGeometry(.34,.26,.6,20),M(0xffffff),4.1,.3,-3.2);
[[0,1.05,0,.5],[.25,.85,.1,.38],[-.22,.9,-.05,.36],[.05,1.35,.05,.32]].forEach(([x,y,z,r])=>mesh(new THREE.SphereGeometry(r,16,12),M(0x5a9a5a),4.1+x,y,-3.2+z));
[[-3.1,2.9,0xffc94d],[-2.1,3.05,0x8cc9e8]].forEach(([x,y,c])=>{ mesh(new THREE.BoxGeometry(.75,.9,.06),M(0xffffff),x,y,Z+.14); mesh(new THREE.BoxGeometry(.6,.75,.02),M(c),x,y,Z+.18); });
mesh(new THREE.BoxGeometry(1.6,.08,.4),M(0xb98a5e),3.6,2.4,Z+.3);
[[3.1,.5,0x8db596],[3.35,.42,0xff9f75],[3.55,.5,0xffc94d]].forEach(([x,h,c])=>mesh(new THREE.BoxGeometry(.18,h,.3),M(c),x,2.44+h/2,Z+.3));
// ---------------------------------------------------------------- the woopi character (built from capsules)
const skin=M(0xffd6b5), shirt=M(0x8db596), pants=M(0x3d5a80), hairM=M(0x2b1d14), shoe=M(0xffffff), dark=M(0x1b1b1b,{roughness:.4});
function limb(r,len,mat,parent,x,y,z){ const pivot=new THREE.Group(); pivot.position.set(x,y,z); parent.add(pivot);
  mesh(new THREE.CapsuleGeometry(r,len,6,12),mat,0,-len/2-r*.4,0,pivot); return pivot; }
function person(){
  const g=new THREE.Group(); scene.add(g);
  const body=new THREE.Group(); g.add(body);
  mesh(new THREE.CapsuleGeometry(.36,.62,8,16),shirt,0,1.36,0,body).scale.set(1,1,.78);
  const hips=mesh(new THREE.CapsuleGeometry(.33,.12,8,16),pants,0,.92,0,body); hips.scale.set(1,1,.8);
  const head=new THREE.Group(); head.position.set(0,2.02,0); body.add(head);
  mesh(new THREE.SphereGeometry(.34,28,20),skin,0,0,0,head);
  const hair=mesh(new THREE.SphereGeometry(.36,28,20,0,Math.PI*2,0,Math.PI*.55),hairM,0,.04,-.02,head); hair.rotation.x=-.25;
  mesh(new THREE.SphereGeometry(.045,10,8),dark,-.12,.02,.31,head); mesh(new THREE.SphereGeometry(.045,10,8),dark,.12,.02,.31,head);
  const blushM=M(0xff9f8a); mesh(new THREE.SphereGeometry(.05,10,8),blushM,-.21,-.08,.26,head).scale.set(1,.5,.4); mesh(new THREE.SphereGeometry(.05,10,8),blushM,.21,-.08,.26,head).scale.set(1,.5,.4);
  const smile=mesh(new THREE.TorusGeometry(.07,.016,6,16,Math.PI),dark,0,-.12,.31,head); smile.rotation.z=Math.PI;
  const armL=limb(.1,.62,shirt,body,-.47,1.66,0), armR=limb(.1,.62,shirt,body,.47,1.66,0);
  mesh(new THREE.SphereGeometry(.11,12,10),skin,0,-.86,0,armL); mesh(new THREE.SphereGeometry(.11,12,10),skin,0,-.86,0,armR);
  const legL=limb(.13,.6,pants,body,-.17,.85,0), legR=limb(.13,.6,pants,body,.17,.85,0);
  mesh(new THREE.BoxGeometry(.24,.12,.36),shoe,0,-.84,.06,legL); mesh(new THREE.BoxGeometry(.24,.12,.36),shoe,0,-.84,.06,legR);
  return {g,body,head,armL,armR,legL,legR,smile};
}
const P=person();

// ---------------------------------------------------------------- props
// bed (head against the back wall), nightstand with a lamp
const bed=new THREE.Group(); bed.position.set(-2.8,0,-2.2); scene.add(bed);
mesh(new THREE.BoxGeometry(1.9,.4,3),M(0xb98a5e),0,.3,0,bed);
mesh(new THREE.BoxGeometry(1.8,.25,2.9),M(0xffffff),0,.62,0,bed);
const blanket=mesh(new THREE.BoxGeometry(1.86,.12,1.9),M(0x8cc9e8),0,.78,.45,bed);
mesh(new THREE.CapsuleGeometry(.22,.9,6,12),M(0xfff6ec),0,.86,-1.15,bed).rotation.z=Math.PI/2;
mesh(new THREE.BoxGeometry(1.9,1.3,.15),M(0xb98a5e),0,.7,-1.55,bed);
const stand=new THREE.Group(); stand.position.set(-1.25,0,-3.35); scene.add(stand);
mesh(new THREE.BoxGeometry(.8,.6,.6),M(0xd8b48a),0,.3,0,stand);
mesh(new THREE.CylinderGeometry(.12,.16,.35,16),M(0xffffff),-.18,.78,-.05,stand);
const shade=mesh(new THREE.ConeGeometry(.3,.35,24,1,true),M(0xffe9a8,{emissive:0xffd27a,emissiveIntensity:.6,side:THREE.DoubleSide}),-.18,1.1,-.05,stand);
const lamp=new THREE.PointLight(0xffcf8a,6,5,1.6); lamp.position.set(-1.43,1.05,-3.4); scene.add(lamp);
// alarm clock (face drawn on a canvas)
const clock=new THREE.Group(); clock.position.set(-2.8,2.6,-2.9); clock.scale.setScalar(.7); scene.add(clock);
const faceCv=document.createElement('canvas'); faceCv.width=faceCv.height=256; const fx=faceCv.getContext('2d'); const faceTex=new THREE.CanvasTexture(faceCv); faceTex.colorSpace=THREE.SRGBColorSpace;
function paintFace(txt){ fx.fillStyle='#fff6ec'; fx.fillRect(0,0,256,256); fx.fillStyle='#1f3d2b'; fx.font='900 92px Inter'; fx.textAlign='center'; fx.textBaseline='middle'; fx.fillText(txt,128,128); faceTex.needsUpdate=true; }
const body_=mesh(new THREE.CylinderGeometry(.75,.75,.35,40),M(0xff9f75),0,0,0,clock); body_.rotation.x=Math.PI/2;
const face=mesh(new THREE.CircleGeometry(.62,40),new THREE.MeshStandardMaterial({map:faceTex,roughness:.6}),0,0,.18,clock); face.castShadow=false;
const bellL=mesh(new THREE.SphereGeometry(.25,16,12,0,Math.PI*2,0,Math.PI/2),M(0xffc94d,{metalness:.3,roughness:.4}),-.5,.72,0,clock); bellL.rotation.z=.5;
const bellR=mesh(new THREE.SphereGeometry(.25,16,12,0,Math.PI*2,0,Math.PI/2),M(0xffc94d,{metalness:.3,roughness:.4}),.5,.72,0,clock); bellR.rotation.z=-.5;
// glass of water (small in hand) + big floating glass
const glassMat=new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.35,roughness:.1});
const waterMat=M(0x5fb6e8,{roughness:.2,transparent:true,opacity:.9});
const bigGlass=new THREE.Group(); bigGlass.position.set(-1.05,2.3,-1.4); scene.add(bigGlass);
mesh(new THREE.CylinderGeometry(.55,.45,1.5,32,1,true),glassMat,0,0,0,bigGlass).castShadow=false;
mesh(new THREE.CircleGeometry(.45,32),glassMat,0,-.75,0,bigGlass).rotation.x=-Math.PI/2;
const bigWater=mesh(new THREE.CylinderGeometry(.5,.43,1.4,32),waterMat,0,-.05,0,bigGlass);
const handGlass=new THREE.Group(); handGlass.position.set(0,-.98,.08); P.armR.add(handGlass);
mesh(new THREE.CylinderGeometry(.12,.1,.3,16),glassMat,0,0,0,handGlass);
mesh(new THREE.CylinderGeometry(.105,.09,.22,16),waterMat,0,-.03,0,handGlass);
// water drops
const drops=[0,1,2].map(i=>{ const d=new THREE.Group(); scene.add(d);
  mesh(new THREE.SphereGeometry(.16,16,12),waterMat,0,0,0,d); const c=mesh(new THREE.ConeGeometry(.155,.3,16),waterMat,0,.2,0,d); return d; });
// sun
const sun=mesh(new THREE.SphereGeometry(1.1,40,30),new THREE.MeshBasicMaterial({color:0xffd56b}),2.6,-1,-15); sun.castShadow=false; sun.receiveShadow=false;
const glowCv=document.createElement('canvas'); glowCv.width=glowCv.height=128; const gx=glowCv.getContext('2d');
const gr=gx.createRadialGradient(64,64,0,64,64,64); gr.addColorStop(0,'rgba(255,220,130,.9)'); gr.addColorStop(1,'rgba(255,220,130,0)'); gx.fillStyle=gr; gx.fillRect(0,0,128,128);
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(glowCv),transparent:true,depthWrite:false})); glow.scale.set(7,7,1); scene.add(glow);
// phone + red "no" sign
const phone=new THREE.Group(); phone.position.set(-1.05,.64,-3.3); phone.scale.setScalar(.55); scene.add(phone);
mesh(new THREE.BoxGeometry(.5,.07,.95),M(0x1f2330,{roughness:.3}),0,0,0,phone);
const screenCv=document.createElement('canvas'); screenCv.width=128; screenCv.height=240; const sx=screenCv.getContext('2d');
sx.fillStyle='#2f6fd6'; sx.fillRect(0,0,128,240); sx.fillStyle='#fff'; [40,90,140].forEach(y=>{ sx.beginPath(); sx.roundRect(12,y,104,36,8); sx.fill(); });
const screenTex=new THREE.CanvasTexture(screenCv); screenTex.colorSpace=THREE.SRGBColorSpace;
const scr=mesh(new THREE.PlaneGeometry(.44,.86),new THREE.MeshBasicMaterial({map:screenTex}),0,.04,0,phone); scr.rotation.x=-Math.PI/2; scr.castShadow=false;
const noSign=new THREE.Group(); noSign.position.set(-1.1,1.55,-3.2); scene.add(noSign);

mesh(new THREE.TorusGeometry(.75,.11,14,48),red,0,0,0,noSign); mesh(new THREE.BoxGeometry(1.45,.2,.2),red,0,0,0,noSign).rotation.z=Math.PI/4;

// ---------------------------------------------------------------- camera keys per scene: [time, pos, target]
const STAND=[.2,0,-.5];
const CAM=[
 [0,[-.8,4.6,2.6],[-2.7,1.0,-2.2]],
 [SC.hook.start+1.6,[-.4,3.8,3.0],[-2.6,1.3,-2.0]],
 [SC.hook.end-.3,[.6,3.2,4.6],[-1.0,1.3,-1.2]],
 [SC.water.start+.4,[1.2,2.6,4.6],[-.3,1.6,-.8]],
 [SC.water.end-.2,[.9,2.4,4.0],[-.3,1.7,-.8]],
 [SC.sun.start+.5,[-1.4,2.3,3.6],[1.4,2.0,-3.6]],
 [SC.sun.end-.2,[-1.0,2.0,3.0],[1.6,2.3,-3.8]],
 [SC.phone.start+.4,[3.3,2.6,2.0],[-.6,1.0,-2.6]],
 [SC.phone.end-.2,[3.0,2.4,1.6],[-.6,1.1,-2.6]],
 [SC.outro.start+.5,[.8,3.2,6.6],[-.4,1.5,-1.6]],
 [TL.total,[.8,3.8,8],[-.4,1.7,-1.6]],
];
function camAt(t){ let a=CAM[0],b=CAM[0];
  for(let i=1;i<CAM.length;i++){ if(t<CAM[i][0]){ a=CAM[i-1]; b=CAM[i]; break; } a=b=CAM[i]; }
  const k=a===b?0:eio(seg(t,a[0],b[0])); const L=(u,v)=>u.map((x,i)=>lerp(x,v[i],k));
  return [L(a[1],b[1]),L(a[2],b[2])]; }

// ---------------------------------------------------------------- captions: 2–3 words at a time, like the reference
const CHUNKS=[]; TL.lines.forEach(l=>{ const ws=l.text.split(' '); const tot=l.text.length; let acc=0;
  for(let i=0;i<ws.length;){ const n=(ws[i].length<=3&&ws[i+1])?3:2; const part=ws.slice(i,i+n); const a=acc/tot;
    acc+=part.join(' ').length+1; CHUNKS.push({text:part.join(' ').replace(/[.,]$/,''),start:l.start+(l.end-l.start)*a,end:l.start+(l.end-l.start)*Math.min(1,acc/tot)}); i+=n; } });

// ---------------------------------------------------------------- labels + icons (reference-style pop-ups)

  [when('sun','sunlight'),SC.sun.end-.1,'SUNLIGHT','sun'],[when('phone','phone'),SC.phone.end-.1,'NO PHONE','check']];
const ICONS={clock:'<circle cx="50" cy="50" r="42" fill="#fff" stroke="#333" stroke-width="5"/><line x1="50" y1="50" x2="50" y2="20" stroke="#333" stroke-width="6" stroke-linecap="round" id="hand"/><circle cx="50" cy="50" r="5" fill="#333"/>',
  drop:'<path d="M50 8 C68 36 82 52 82 66 a32 32 0 0 1 -64 0 C18 52 32 36 50 8Z" fill="#5fb6e8" stroke="#fff" stroke-width="5"/>',
  sun:'<circle cx="50" cy="50" r="22" fill="#ffc94d"/><g stroke="#ffc94d" stroke-width="7" stroke-linecap="round"><path d="M50 8v12M50 80v12M8 50h12M80 50h12M20 20l9 9M71 71l9 9M80 20l-9 9M29 71l-9 9"/></g>',
  check:'<circle cx="50" cy="50" r="42" fill="#fff" stroke="#2fa65a" stroke-width="6"/><path d="M30 52 l14 14 l28 -30" fill="none" stroke="#2fa65a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="80" id="tick"/>'};
window.POPS=LABELS.map(l=>l[0]); window.CLICKS=[]; window.CONFS=[SC.outro.start+1.6]; window.SWAPS=TL.scenes.slice(1).map(s=>s.start); window.WORDS=[]; window.XP=[];

// ---------------------------------------------------------------- render(t)
function render(t){
  const open=eio(seg(t,SC.sun.start+.2,when('sun','sunlight')+.3));
  const warm=Math.max(seg(t,SC.sun.start,SC.sun.start+2),t>=SC.sun.end?1:0);
  paintSky(warm);
  curL.position.x=lerp(WX0+.6,WX0-.45,open); curR.position.x=lerp(WX1-.6,WX1+.45,open); curL.scale.x=curR.scale.x=lerp(1,.55,open);
  sunLight.intensity=lerp(0,4.2,open); fill.intensity=lerp(.75,1.05,open); hemi.intensity=lerp(.9,1.25,open);
  beam.material.opacity=.16*open; lamp.intensity=lerp(6,2,open);
  const sr=eout(seg(t,SC.sun.start+.3,SC.sun.start+2.6)); sun.position.y=t<SC.sun.start?-1:lerp(-1,3.6,sr); glow.position.copy(sun.position); glow.material.opacity=lerp(.5,1,sr);
  // --- character pose (defaults: standing on the rug, facing the camera)
  const B=P.body; P.g.position.set(...STAND); P.g.rotation.set(0,0,0); B.rotation.set(0,0,0); B.position.set(0,0,0);
  P.armL.rotation.set(0,0,.12); P.armR.rotation.set(0,0,-.12); P.legL.rotation.set(0,0,0); P.legR.rotation.set(0,0,0); P.head.rotation.set(0,0,0);
  handGlass.visible=false;
  // hook: asleep in bed (head on the pillow) -> alarm -> sits up -> walks to the rug
  const wake=when('hook','wake'), sitT=wake+.6, walkT=SC.hook.end+.1;
  const LIE=[-2.8,.8,-1.0];
  if(t<walkT+.9){
    const sit=eio(seg(t,wake-.2,sitT)), walk=eio(seg(t,walkT-.9,walkT+.9));
    if(walk<=0){ P.g.position.set(...LIE); P.g.rotation.x=lerp(-Math.PI/2,0,sit); P.g.position.y=lerp(.8,.55,sit); P.g.position.z=lerp(-1.0,-2.0,sit);
      P.legL.rotation.x=P.legR.rotation.x=lerp(0,-1.5,sit);
      if(sit>0){ const st=seg(t,wake+.1,sitT+.4); P.armL.rotation.z=.12+Math.sin(st*Math.PI)*2.4; P.armR.rotation.z=-.12-Math.sin(st*Math.PI)*2.4; } }
    else { P.g.position.set(lerp(-2.8,STAND[0],walk),lerp(.55,0,seg(walk,0,.35)),lerp(-2.0,STAND[2],walk));
      P.g.rotation.y=lerp(Math.PI/2,0,seg(walk,.5,1));
      const sw=Math.sin(t*9)*.5*(1-seg(walk,.85,1)); P.legL.rotation.x=lerp(-1.5,0,seg(walk,0,.3))+sw; P.legR.rotation.x=lerp(-1.5,0,seg(walk,0,.3))-sw;
      P.armL.rotation.x=-sw*.7; P.armR.rotation.x=sw*.7; B.position.y=Math.abs(Math.sin(t*9))*.05*(1-seg(walk,.85,1)); }
    blanket.position.z=lerp(.45,.95,sit); blanket.rotation.x=lerp(0,.25,sit);
  } else { blanket.position.z=.95; blanket.rotation.x=.25; }
  // alarm clock: shakes until wake, then floats away
  const ring=t<wake+.4; clock.visible=t<SC.hook.end+.2;
  clock.rotation.z=ring?Math.sin(t*50)*.15:0; clock.position.y=2.6+Math.sin(t*2)*.06+seg(t,wake+.4,SC.hook.end)*2;
  clock.scale.setScalar(.7*back(seg(t,.2,.7))*(1-seg(t,SC.hook.end-.6,SC.hook.end)));
  const mins=Math.floor(lerp(0,10,seg(t,.5,SC.hook.end))); paintFace(`6:${String(mins).padStart(2,'0')}`);
  // water: big glass fills next to them, they drink from a small glass
  bigGlass.visible=t>=SC.water.start-.1&&t<SC.water.end+.3;
  if(bigGlass.visible){ const k=back(seg(t,SC.water.start,SC.water.start+.5)); bigGlass.scale.setScalar(Math.max(.001,k*(1-seg(t,SC.water.end-.2,SC.water.end+.3))));
    bigGlass.position.y=2.3+Math.sin(t*2)*.06; bigGlass.rotation.y=t*.6;
    const f=eio(seg(t,when('water','glass'),SC.water.end-.3)); bigWater.scale.y=Math.max(.01,f); bigWater.position.y=-.75+.7*f; }
  drops.forEach((d,i)=>{ const ph=(t*1.3+i/3)%1; d.visible=bigGlass.visible&&t<SC.water.end-.4; d.position.set(-1.05+(i-1)*.15,lerp(3.9,2.4,ph),-1.4); d.scale.setScalar(.6*(1-ph*.4)); });
  if(t>=SC.water.start&&t<SC.water.end){ handGlass.visible=true;
    const lift=eio(seg(t,when('water','Drink')-.2,when('water','Drink')+.5));
    P.armR.rotation.x=lerp(0,-2.0,lift); P.armR.rotation.z=lerp(-.12,-.5,lift); P.head.rotation.x=lerp(0,-.3,seg(t,when('water','Drink')+.3,when('water','Drink')+.8));
    handGlass.rotation.x=lerp(0,1.2,lift); P.g.rotation.y=-.35; }
  // sun: turns to the window and stretches as the curtains open
  if(t>=SC.sun.start&&t<SC.sun.end){ P.g.rotation.y=lerp(-.35,2.75,eio(seg(t,SC.sun.start,SC.sun.start+.8)));
    const st=eio(seg(t,when('sun','sunlight')-.2,when('sun','sunlight')+.5)); P.armL.rotation.z=lerp(.12,2.8,st); P.armR.rotation.z=-lerp(.12,2.8,st);
    P.head.rotation.x=lerp(0,-.25,st); B.position.y=Math.sin((t-SC.sun.start)*6)*.03*st; }
  // phone: buzzes on the nightstand; they look, then turn away; a red no-sign pops above it
  const pb=t>=SC.phone.start-.1&&t<SC.outro.start+.2; noSign.visible=pb;
  if(pb){ const nk=back(seg(t,when('phone','touch')-.1,when('phone','touch')+.35)); noSign.scale.setScalar(Math.max(.001,nk*.42)); noSign.rotation.y=Math.sin(t*2)*.3; }
  const buzz=t>=SC.phone.start-.1&&t<when('phone','touch')+.3; phone.rotation.y=buzz?Math.sin(t*60)*.1:0; phone.position.y=.64+(buzz?Math.abs(Math.sin(t*30))*.02:0);
  if(t>=SC.phone.start&&t<SC.phone.end){ const look=eio(seg(t,SC.phone.start,SC.phone.start+.5)), away=eio(seg(t,when('phone','touch'),when('phone','touch')+.6));
    P.g.rotation.y=lerp(lerp(2.75,3.6,look),5.6,away); P.head.rotation.x=lerp(.2*look,-.1,away);
    P.armL.rotation.z=lerp(.12,1.0,away); P.armR.rotation.z=-lerp(.12,1.0,away); }
  // outro: faces the camera and waves
  if(t>=SC.outro.start){ const turn=eio(seg(t,SC.outro.start-.2,SC.outro.start+.4)); P.g.rotation.y=lerp(5.6,2*Math.PI,turn);
    const wv=seg(t,SC.outro.start+.3,SC.outro.start+.8); P.armR.rotation.z=-lerp(.12,2.6,wv)-Math.sin(t*8)*.25*wv; }
  // walking bob between scenes
  // camera
  const [cp,ct]=camAt(t); camera.position.set(...cp); camera.lookAt(...ct); camera.updateMatrixWorld();
  renderer.render(scene,camera);

  // ---- 2D overlays
  const lab=LABELS.find(l=>t>=l[0]&&t<l[1]), L=$('label'), I=$('icon');
  if(lab){ const p=back(seg(t,lab[0],lab[0]+.35)), o=1-seg(t,lab[1]-.2,lab[1]); L.textContent=lab[2]; L.style.opacity=clamp(p*1.5)*o; L.style.transform=`scale(${lerp(.4,1,p)})`;
    if(I.dataset.k!==String(lab[3])){ I.innerHTML=lab[3]?ICONS[lab[3]]:''; I.dataset.k=String(lab[3]); }
    const ip=back(seg(t,lab[0]+.15,lab[0]+.5)); I.style.opacity=clamp(ip*1.5)*o; I.style.transform=`scale(${ip}) rotate(${Math.sin(t*3)*6}deg)`;
    const hd=I.querySelector('#hand'); if(hd) hd.setAttribute('transform',`rotate(${(t*240)%360} 50 50)`);
    const tk=I.querySelector('#tick'); if(tk) tk.setAttribute('stroke-dashoffset',80*(1-eout(seg(t,lab[0]+.3,lab[0]+.7)))); }
  else { L.style.opacity=0; I.style.opacity=0; }
  const E=$('end'); const ep=back(seg(t,SC.outro.start+.4,SC.outro.start+.9)); E.style.opacity=t>=SC.outro.start?clamp(ep*1.5):0; E.style.transform=`scale(${lerp(.7,1,ep)})`;
  [0,1,2].forEach(i=>{ const a=SC.outro.start+1.2+i*.2, q=back(seg(t,a,a+.3)); $('ck'+i).style.transform=`scale(${q})`; });
  $('tag').style.opacity=t<SC.outro.start?1:1-seg(t,SC.outro.start,SC.outro.start+.4);
  const ch=CHUNKS.find(c=>t>=c.start-.03&&t<c.end+.05), C=$('cap');
  if(ch){ C.textContent=ch.text; C.style.opacity=1; } else C.style.opacity=0;
  $('fade').style.opacity=t<.25?1-seg(t,0,.25):seg(t,TL.total-.5,TL.total);
}
window.render=render;
document.fonts.ready.then(()=>{ render(0); window.READY=true; });
if(!location.search.includes('render')){ const t0=performance.now(); (function loop(){ if(window.READY) render(((performance.now()-t0)/1000)%TL.total); requestAnimationFrame(loop); })(); }
</script></body></html>
