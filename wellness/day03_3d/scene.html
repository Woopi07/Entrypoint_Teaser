[[-3.1,2.9,0xffc94d],[-2.1,3.05,0x8cc9e8]].forEach(([x,y,c])=>{ mesh(new THREE.BoxGeometry(.75,.9,.06),M(0xffffff),x,y,Z+.14); mesh(new THREE.BoxGeometry(.6,.75,.02),M(c),x,y,Z+.18); });

[[3.1,.5,0x8db596],[3.35,.42,0xff9f75],[3.55,.5,0xffc94d]].forEach(([x,h,c])=>mesh(new THREE.BoxGeometry(.18,h,.3),M(c),x,2.44+h/2,Z+.3));

mesh(new THREE.BoxGeometry(1.9,.4,3),M(0xb98a5e),0,.3,0,bed);

mesh(new THREE.CapsuleGeometry(.22,.9,6,12),M(0xfff6ec),0,.86,-1.15,bed).rotation.z=Math.PI/2;
mesh(new THREE.BoxGeometry(1.9,1.3,.15),M(0xb98a5e),0,.7,-1.55,bed);

mesh(new THREE.BoxGeometry(.8,.6,.6),M(0xd8b48a),0,.3,0,stand);
mesh(new THREE.CylinderGeometry(.12,.16,.35,16),M(0xffffff),-.18,.78,-.05,stand);

const lamp=new THREE.PointLight(0xffcf8a,6,5,1.6); lamp.position.set(-1.43,1.05,-3.4); scene.add(lamp);

  if(t>=SC.outro.start){ const wv=seg(t,SC.outro.start+.3,SC.outro.start+.8); P.armR.rotation.z=-lerp(.12,2.6,wv)-Math.sin(t*8)*.25*wv; }
  // walking bob between scenes
  // camera
  const out=OUT(t);
  if(out){ P.g.position.x+=OX; [clock,bolt,sneaker,cloud].forEach(o=>o.position.x+=OX); cloud.position.y=5.2; cloud.position.z=-10; cloud.scale.multiplyScalar(1.6);
    sunLight.position.set(OX+7,13,6); sunLight.target.position.set(OX,0,-.5); sunLight.intensity=3.4; fill.position.set(OX+4,7,8); hemi.intensity=1.35; paintSky(1);
    const sr2=eout(seg(t,SC.clock.start,SC.clock.start+2.8)); sun2.position.y=t<SC.sleep.start?lerp(2,8,sr2):9; glow2.position.copy(sun2.position); }
  else { sunLight.position.set(3.2,6.5,-12); sunLight.target.position.set(.2,0,0); fill.position.set(4,7,8); }
  const [cp,ct]=camAt(t); if(out){ cp[0]+=OX; ct[0]+=OX; }
  camera.position.set(...cp); camera.lookAt(...ct); camera.updateMatrixWorld();
  { const fl=Math.max(...CUTS().map(c=>t>=c-.15&&t<c+.35?(t<c?seg(t,c-.15,c):1-seg(t,c,c+.35)):0)); $('wflash').style.opacity=fl; }
  renderer.render(scene,camera);

  // ---- 2D overlays
  const lab=LABELS.find(l=>t>=l[0]&&t<l[1]), L=$('label'), I=$('icon');
  if(lab){ const p=back(seg(t,lab[0],lab[0]+.35)), o=1-seg(t,lab[1]-.2,lab[1]); L.textContent=lab[2]; L.style.opacity=clamp(p*1.5)*o; L.style.transform=`scale(${lerp(.4,1,p)})`;
    if(I.dataset.k!==String(lab[3])){ I.innerHTML=lab[3]?ICONS[lab[3]]:''; I.dataset.k=String(lab[3]); }
    const ip=back(seg(t,lab[0]+.15,lab[0]+.5)); I.style.opacity=clamp(ip*1.5)*o; I.style.transform=`scale(${ip}) rotate(${Math.sin(t*3)*6}deg)`;
    const hd=I.querySelector('#hand'); if(hd) hd.setAttribute('transform',`rotate(${(t*240)%360} 50 50)`);
    const tk=I.querySelector('#tick'); if(tk) tk.setAttribute('stroke-dashoffset',80*(1-eout(seg(t,lab[0]+.3,lab[0]+.7)))); }
  else { L.style.opacity=0; I.style.opacity=0; }
  const E=$('end'); const ep=back(seg(t,SC.outro.start+.4,SC.outro.start+.9)); E.style.opacity=t>=SC.outro.start?clamp(ep*1.5):0; E.style.transform=`scale(${lerp(.7,1,ep)})`;
  [0,1,2,3].forEach(i=>{ const a=SC.outro.start+1.2+i*.15, q=back(seg(t,a,a+.3)); $('ck'+i).style.transform=`scale(${q})`; });
  const lv=[[0,.08],[SC.clock.start+1,.3],[SC.energy.start+1,.5],[SC.sleep.start+1.2,.65],[SC.time.start+1.4,.85],[SC.bonus.start+1.2,1]];
  let lvl=.08; for(let i=1;i<lv.length;i++) lvl=lerp(lvl,lv[i][1],eout(seg(t,lv[i][0],lv[i][0]+.8)));
  const mo=t<SC.poll.start?Math.min(seg(t,SC.hook.end,SC.hook.end+.4),1-seg(t,SC.poll.start-.4,SC.poll.start)):0; $('meter').style.opacity=mo; $('mfill').style.width=(lvl*100)+'%';
  const bt=$('icon').querySelector('#batt'); if(bt){ const k=seg(t,when('energy','awake'),SC.energy.end-.4); bt.setAttribute('width',12+50*k); bt.setAttribute('fill',k>.6?'#2fa65a':'#ffb020'); }
  const pp=back(seg(t,SC.poll.start,SC.poll.start+.4)), po=t>=SC.poll.start&&t<SC.poll.end?1-seg(t,SC.poll.end-.3,SC.poll.end):0;
  $('poll').style.opacity=clamp(pp*1.5)*po; $('poll').style.transform=`scale(${lerp(.8,1,pp)})`;
  [0,1,2].forEach(i=>{ const a=SC.poll.start+.3+i*.12; const e=$('po'+i); e.style.opacity=seg(t,a,a+.2); e.className='op'+(i===0&&t>=when('poll','sunlight')+.2?' pick':''); });
  const cq=back(seg(t,when('poll','comments')-.2,when('poll','comments')+.2)); $('cmt').style.opacity=clamp(cq*1.5); $('cmt').style.transform=`scale(${cq})`;
  $('tag').style.opacity=t<SC.outro.start?1:1-seg(t,SC.outro.start,SC.outro.start+.4);
  const ch=CHUNKS.find(c=>t>=c.start-.03&&t<c.end+.05), C=$('cap');
  if(ch){ C.textContent=ch.text; C.style.opacity=1; } else C.style.opacity=0;
  { const T=$('title'), a=.15, b=SC.hook.end+.25, p=back(seg(t,a,a+.5)), o=1-seg(t,b-.35,b);
    T.style.opacity=t<b?clamp(p*1.5)*o:0; T.style.transform=`translateY(${lerp(-60,0,p)}px) scale(${lerp(.85,1,p)})`; $('tag').style.visibility=t<b?'hidden':'visible'; }
  $('fade').style.opacity=t<.25?1-seg(t,0,.25):seg(t,TL.total-.5,TL.total);
}
window.render=render;
document.fonts.ready.then(()=>{ render(0); window.READY=true; });
if(!location.search.includes('render')){ const t0=performance.now(); (function loop(){ if(window.READY) render(((performance.now()-t0)/1000)%TL.total); requestAnimationFrame(loop); })(); }
</script></body></html>
