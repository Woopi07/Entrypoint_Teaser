<!doctype html>
<html><head><meta charset="utf-8"><title>woopi banners v2</title>
<!-- ?grass = option A (photo + hand lettering), ?blue = option B (bold type + objects). Add &guide to see YouTube's safe area. -->
<style>
@font-face{font-family:Gluten;font-weight:700;src:url(../fonts/gluten.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:2560px;height:1440px;overflow:hidden}
.bn{position:relative;width:2560px;height:1440px;overflow:hidden}
.safe{position:absolute;left:507px;top:508px;width:1546px;height:423px;display:flex;flex-direction:column;align-items:center;justify-content:center}
#guide{position:absolute;left:507px;top:508px;width:1546px;height:423px;border:6px dashed #e5484d;display:none;z-index:9}
.deco{position:absolute;z-index:3}

/* ---------- A: grass ---------- */
#grass{background:url(grass_2560.jpg) center/cover}
#grass .shade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 52%,rgba(0,0,0,.2),transparent 55%)}
#grass .word{font-family:Gluten;font-weight:700;font-size:215px;line-height:1;color:#ecd89c;white-space:nowrap}
#grass .word span{display:inline-block}
#grass .word svg.o{display:inline-block;width:.6em;height:.56em;vertical-align:baseline;margin:0 .01em}
#grass .tag{font-family:Gluten;font-weight:700;font-size:62px;color:#ecd89c;margin-top:12px;white-space:nowrap;letter-spacing:.01em}
#grass svg.deco *{fill:#ecd89c}

/* ---------- B: blue ---------- */
#blue{background:#1650ae}
#blue .safe{align-items:flex-start;padding-left:220px;padding-bottom:20px}
#blue .l1,#blue .l2{font-family:"Inter Display",Inter,sans-serif;font-weight:900;color:#f8eba8;white-space:nowrap;line-height:.8}
#blue .l1{font-size:185px;letter-spacing:-.065em}
#blue .l2{font-size:86px;letter-spacing:-.05em;margin-top:46px}
#blue .deco{filter:drop-shadow(0 14px 12px rgba(0,0,0,.35))}
</style></head><body>

<div class="bn" id="grass" hidden>
  <div class="shade"></div>
  <div class="safe">
    <div class="word" id="gw"><span style="transform:rotate(-7deg) translateY(4px)">w</span><svg class="o" viewBox="0 0 100 94" style="transform:rotate(14deg)"><circle cx="50" cy="47" r="40" fill="none" stroke="#ecd89c" stroke-width="16"/><path d="M50 47 a4 4 0 0 1 8 0 a9 9 0 0 1 -17 1 a14 14 0 0 1 26 -2" fill="none" stroke="#ecd89c" stroke-width="6" stroke-linecap="round"/></svg><svg class="o" viewBox="0 0 100 94" style="transform:rotate(-24deg) translateY(-10px)"><circle cx="50" cy="47" r="40" fill="none" stroke="#ecd89c" stroke-width="16"/><path d="M50 47 a4 4 0 0 1 8 0 a9 9 0 0 1 -17 1 a14 14 0 0 1 26 -2" fill="none" stroke="#ecd89c" stroke-width="6" stroke-linecap="round"/></svg><span style="transform:rotate(5deg) translateY(10px)">p</span><span id="gi" style="transform:rotate(-4deg)">ı</span></div>
    <div class="tag">small habits, better days</div>
  </div>
  <!-- doodles, placed around the word by script -->
  <svg class="deco" id="gFlowerI" viewBox="-40 -40 80 80" style="width:72px"><g><circle r="16" cy="-21"/><circle r="16" cx="20" cy="-7"/><circle r="16" cx="12" cy="17"/><circle r="16" cx="-12" cy="17"/><circle r="16" cx="-20" cy="-7"/></g><circle r="9" style="fill:#6c8a24"/></svg>
  <svg class="deco" id="gFlowerL" viewBox="-40 -40 80 80" style="width:52px"><circle r="16" cy="-21"/><circle r="16" cx="20" cy="-7"/><circle r="16" cx="12" cy="17"/><circle r="16" cx="-12" cy="17"/><circle r="16" cx="-20" cy="-7"/><circle r="9" style="fill:#6c8a24"/></svg>
  <svg class="deco" id="gSprig" viewBox="0 0 260 70" style="width:185px"><path d="M10 52 C90 40 170 40 250 52" style="fill:none;stroke:#ecd89c;stroke-width:10;stroke-linecap:round"/>
    <path d="M60 47 q-6 -34 26 -44 q4 32 -26 44Z"/><path d="M110 43 q-4 -36 28 -42 q2 34 -28 42Z"/><path d="M160 43 q0 -36 32 -40 q0 34 -32 40Z"/>
    <path d="M80 48 q24 22 52 12 q-18 -24 -52 -12Z"/><path d="M135 46 q26 20 54 8 q-20 -22 -54 -8Z"/></svg>
  <svg class="deco" id="gDots" viewBox="0 0 60 60" style="width:44px"><circle cx="20" cy="38" r="13"/><circle cx="44" cy="20" r="8"/><circle cx="46" cy="46" r="6"/></svg>
  <svg class="deco" id="gDots2" viewBox="0 0 60 60" style="width:42px"><circle cx="40" cy="38" r="13"/><circle cx="16" cy="20" r="8"/><circle cx="14" cy="48" r="6"/></svg>
  <svg class="deco" id="gSpark" viewBox="-40 -40 80 80" style="width:50px"><path d="M0 -36 L9 -9 36 0 9 9 0 36 -9 9 -36 0 -9 -9Z"/></svg>
</div>

<div class="bn" id="blue" hidden>
  <div class="safe"><div class="l1" id="bw">woopı</div><div class="l2" id="bt">small habits, better days.</div></div>
  <svg class="deco" id="sprout" viewBox="0 0 200 220" style="width:126px"><defs>
    <linearGradient id="lf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8e6a2"/><stop offset="1" stop-color="#3e9b4f"/></linearGradient></defs>
    <path d="M100 220 C100 170 100 150 100 120" stroke="#2f7a3c" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M100 140 C40 140 8 100 2 48 C60 48 98 82 100 140Z" fill="url(#lf)"/>
    <path d="M100 124 C160 124 194 84 198 30 C140 30 102 66 100 124Z" fill="url(#lf)"/>
    <path d="M30 70 C60 90 80 110 96 136M170 52 C140 72 118 94 104 120" stroke="#e6f7dc" stroke-width="5" fill="none" opacity=".7" stroke-linecap="round"/></svg>
  <svg class="deco" id="drop" viewBox="0 0 120 160" style="width:74px"><defs>
    <radialGradient id="dg" cx=".35" cy=".4" r=".8"><stop offset="0" stop-color="#e3f6ff"/><stop offset=".45" stop-color="#7cc7f0"/><stop offset="1" stop-color="#2f83c8"/></radialGradient></defs>
    <path d="M60 4 C90 50 116 82 116 108 a56 56 0 0 1 -112 0 C4 82 30 50 60 4Z" fill="url(#dg)"/>
    <ellipse cx="40" cy="96" rx="12" ry="20" fill="#fff" opacity=".7" transform="rotate(20 40 96)"/></svg>
  <svg class="deco" id="stars" viewBox="0 0 160 200" style="width:90px"><defs>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2b0"/><stop offset=".5" stop-color="#e9b949"/><stop offset="1" stop-color="#b07d1a"/></linearGradient></defs>
    <path d="M100 10 l13 30 32 3 -24 21 7 32 -28 -17 -28 17 7 -32 -24 -21 32 -3Z" fill="url(#sg)"/>
    <path d="M45 110 l10 23 25 2 -19 16 6 25 -22 -13 -22 13 6 -25 -19 -16 25 -2Z" fill="url(#sg)"/></svg>
</div>

<div id="guide"></div>
<script>
const q=location.search, which=q.includes('blue')?'blue':'grass';
document.getElementById(which).hidden=false;
if(q.includes('guide')) document.getElementById('guide').style.display='block';
const $=id=>document.getElementById(id);
const rect=el=>el.getBoundingClientRect();
function charBox(el,i){ const r=document.createRange(); r.setStart(el.firstChild,i); r.setEnd(el.firstChild,i+1); return r.getBoundingClientRect(); }
function put(id,x,y,rot=0){ const e=$(id), w=e.getBoundingClientRect().width, h=e.getBoundingClientRect().height; e.style.left=(x-w/2)+'px'; e.style.top=(y-h/2)+'px'; e.style.transform=`rotate(${rot}deg)`; }
document.fonts.ready.then(()=>{
  if(which==='grass'){
    const w=rect($('gw')), i=rect($('gi'));
    // flower as the dot of the i; the stem's top sits ~45% down the em box
    put('gFlowerI', i.left+i.width*.52, i.top+i.height*.2, 15);
    put('gSprig', w.left+w.width*.42, w.top+w.height*.06, -4);
    put('gFlowerL', w.left-30, w.top+w.height*.38);
    put('gDots', w.left-22, w.bottom-20);
    put('gDots2', w.right+30, w.top+w.height*.3);
    put('gSpark', w.right+52, w.bottom-60);
  } else {
    const bw=$('bw'), bt=$('bt');
    const i=charBox(bw,4), wch=charBox(bw,0), last=charBox(bt,bt.textContent.length-1);
    // sprout grows from the top of the dotless i (x-height top ~ 27% into the line box at line-height .8)
    const stemTop=i.top+i.height*.17+33;
    const S=$('sprout'); S.style.left=(i.left+i.width/2-63)+'px'; S.style.top=(stemTop-126)+'px';
    put('drop', wch.left-14, wch.top+wch.height*.62, -16);
    put('stars', last.right+45, last.top+last.height*.35);
  }
});
</script></body></html>
